[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Bounded, authorization-based red-team testing for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "build>=1.2,<2"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentshield = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
