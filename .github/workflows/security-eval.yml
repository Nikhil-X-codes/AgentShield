name: AgentShield security evaluation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local-security-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Promptfoo runtime
        run: npm ci --no-audit --no-fund
      - name: Install pinned React UI dependencies
        working-directory: web-ui
        run: npm ci --no-audit --no-fund
      - name: Build local web console
        working-directory: web-ui
        run: npm run build
      - name: Install AgentShield, web API, and development dependencies
        run: python -m pip install -e ".[dev,web]"
      - name: Validate isolated CI configuration
        run: agentshield validate-config configs/ci-agent.yaml
      - name: Generate and validate Promptfoo configuration
        run: |
          agentshield promptfoo-config --config configs/promptfoo-ci.yaml --output reports/promptfoo-ci.yaml
          npm exec -- promptfoo validate config -c reports/promptfoo-ci.yaml
      - name: Run unit and local integration tests
        run: python -m pytest -q
      - name: Run bounded synthetic baseline suite
        run: agentshield run --config configs/ci-agent.yaml --mode baseline --output-dir reports
