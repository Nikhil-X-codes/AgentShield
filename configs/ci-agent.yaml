project:
  name: agentshield-ci
  environment: isolated-test
target:
  adapter: mock
  fixture: mock
  timeout_seconds: 1
scope:
  allowed_hosts: []
  allowed_tools: []
  allow_real_side_effects: false
  use_mock_tools: true
testing:
  categories: [prompt_injection, sensitive_output]
  generated_variants_per_category: 0
  adaptive_retries: 0
  max_total_tests: 5
  max_requests_per_minute: 600
  max_wall_clock_seconds: 30
policy:
  sensitive_tools: [transfer_funds]
  require_approval: [transfer_funds]
  default_tool_policy: deny
thresholds:
  fail_on_confirmed_critical: true
  max_confirmed_high: 0
