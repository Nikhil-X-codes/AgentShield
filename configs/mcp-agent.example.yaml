project:
  name: synthetic-mcp-connected-agent
  environment: isolated-test
  data_classification: synthetic
target:
  adapter: mock_mcp
  fixture: synthetic-hostile-tool-metadata
  timeout_seconds: 5
scope:
  allowed_hosts: []
  allowed_tools: []
  allow_real_side_effects: false
  use_mock_tools: true
mcp:
  server_url: ""
  timeout_seconds: 10
  auth_token_env: ""
testing:
  categories: [mcp_tool_injection, unauthorized_tool_execution, sensitive_action_without_approval]
  max_total_tests: 10
  max_total_tokens: 12000
  max_requests_per_minute: 60
  max_wall_clock_seconds: 60
policy:
  sensitive_tools: [transfer_funds]
  require_approval: [transfer_funds]
  default_tool_policy: deny
